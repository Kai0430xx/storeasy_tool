name: Auto Increment Version

on:
  push:
    branches:
      - main

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Version Tag
        id: gen_ver
        run: |
          DATE_STR=$(date +%Y%m%d)
          TODAY_COMMITS=$(git rev-list --count --since="midnight" HEAD)
          if [ "$TODAY_COMMITS" -eq 0 ]; then
            TODAY_COMMITS=1
          fi
          VERSION="${DATE_STR}_${TODAY_COMMITS}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update index.html with new version
        run: |
          VERSION="${{ steps.gen_ver.outputs.version }}"
          echo "Injecting version: $VERSION"
          sed -i "s/%%VERSION_TAG%%/$VERSION/g" index.html

      - name: Commit and Push Version Update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update system version to ${{ steps.gen_ver.outputs.version }}" && git push)
