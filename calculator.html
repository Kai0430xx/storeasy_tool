<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>費用計算與管理小工具 - 迷你倉庫</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #b45309;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-main: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; }
        
        /* 側邊欄容器樣式 (配合 sidebar.js) */
        aside { width: 260px; flex-shrink: 0; }
        
        .main-content { flex-grow: 1; max-width: 900px; margin: 0 auto; padding-left: 20px; }
        
        .card { background: var(--card-bg); border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 24px; scroll-margin-top: 20px; }
        .card-title { font-size: 1.25rem; font-weight: bold; color: var(--primary); margin-bottom: 16px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        
        /* 快捷導覽列 */
        .nav-bar { background: var(--card-bg); border-radius: 12px; padding: 16px 24px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 24px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .nav-bar span { font-weight: bold; color: var(--primary); margin-right: 8px; }
        .nav-link { background: #f1f5f9; color: var(--primary); padding: 6px 14px; border-radius: 20px; text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: all 0.2s; }
        .nav-link:hover { background: var(--accent); color: white; }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; }
        
        .result-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .result-table th, .result-table td { border: 1px solid var(--border-color); padding: 10px 14px; text-align: left; font-size: 0.95rem; }
        .result-table th { background: #f8fafc; color: var(--primary); width: 40%; }
        .result-table td { background: #ffffff; font-weight: 600; color: var(--accent); }
    </style>
</head>
<body>

<!-- 共用側邊欄容器 -->
<aside id="sidebar"></aside>

<div class="main-content">
    <!-- 快捷錨點導覽列 -->
    <div class="nav-bar">
        <span>📌 快速導航：</span>
        <a href="#tool-1" class="nav-link">租金與押金計算</a>
        <a href="#tool-2" class="nav-link">天數與日租試算</a>
    </div>

    <!-- 小工具 1：租金與押金計算 -->
    <div class="card" id="tool-1">
        <div class="card-title">
            <i class="fa-solid fa-calculator"></i> 1. 租金與押金總額試算
        </div>
        
        <div class="form-group">
            <label>每月租金 (NTD)：</label>
            <input type="number" id="t1-fee" placeholder="例如: 3500" oninput="calcTool1()">
        </div>

        <div class="form-group">
            <label>承租月數：</label>
            <input type="number" id="t1-months" value="1" min="1" oninput="calcTool1()">
        </div>

        <div class="form-group">
            <label>押金月數：</label>
            <input type="number" id="t1-deposit-months" value="1" min="0" oninput="calcTool1()">
        </div>

        <table class="result-table">
            <tr>
                <th>租金小計</th>
                <td id="t1-res-rent">$0 元</td>
            </tr>
            <tr>
                <th>押金小計</th>
                <td id="t1-res-deposit">$0 元</td>
            </tr>
            <tr>
                <th>首付總金額 (含押租金)</th>
                <td id="t1-res-total" style="font-size: 1.1rem; color: #dc2626;">$0 元</td>
            </tr>
        </table>
    </div>

    <!-- 小工具 2：天數與合約到期預估 -->
    <div class="card" id="tool-2">
        <div class="card-title">
            <i class="fa-solid fa-calendar-days"></i> 2. 合約到期日與天數試算
        </div>
        
        <div class="form-group">
            <label>合約起始日：</label>
            <input type="date" id="t2-start" onchange="calcTool2()">
        </div>

        <div class="form-group">
            <label>承租幾個月：</label>
            <input type="number" id="t2-months" value="1" min="1" oninput="calcTool2()">
        </div>

        <table class="result-table">
            <tr>
                <th>預估到期日</th>
                <td id="t2-res-end">-</td>
            </tr>
            <tr>
                <th>總承租天數</th>
                <td id="t2-res-days">-</td>
            </tr>
        </table>
    </div>
</div>

<!-- 引入側邊欄共用腳本 -->
<script src="sidebar.js"></script>
<script>
    // 初始化填入今天的日期給工具2
    document.addEventListener("DOMContentLoaded", function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('t2-start').value = today;
        calcTool1();
        calcTool2();
    });

    // 小工具 1 邏輯
    function calcTool1() {
        const fee = parseFloat(document.getElementById('t1-fee').value) || 0;
        const months = parseInt(document.getElementById('t1-months').value) || 1;
        const depMonths = parseInt(document.getElementById('t1-deposit-months').value) || 1;

        const rentTotal = fee * months;
        const depositTotal = fee * depMonths;
        const grandTotal = rentTotal + depositTotal;

        document.getElementById('t1-res-rent').innerText = '$' + rentTotal.toLocaleString() + ' 元';
        document.getElementById('t1-res-deposit').innerText = '$' + depositTotal.toLocaleString() + ' 元';
        document.getElementById('t1-res-total').innerText = '$' + grandTotal.toLocaleString() + ' 元';
    }

    // 小工具 2 邏輯
    function calcTool2() {
        const startDateVal = document.getElementById('t2-start').value;
        const months = parseInt(document.getElementById('t2-months').value) || 1;

        if (!startDateVal) return;

        let startDate = new Date(startDateVal);
        let endDate = new Date(startDate);
        endDate.setMonth(endDate.getMonth() + months);

        // 計算總天數差異
        const diffTime = Math.abs(endDate - startDate);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        const y = endDate.getFullYear();
        const m = String(endDate.getMonth() + 1).padStart(2, '0');
        const d = String(endDate.getDate()).padStart(2, '0');

        document.getElementById('t2-res-end').innerText = `${y}/${m}/${d}`;
        document.getElementById('t2-res-days').innerText = `${diffDays} 天`;
    }
</script>

</body>
</html>
