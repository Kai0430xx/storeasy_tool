        function initElockerBranches() {
            let branches = getElockerData();
            const branchSelect = document.getElementById('branch-select');
            if (branchSelect) {
                let html = '<option value="">-- 全部據點 --</option>';
                branches.forEach(function(b) {
                    html += '<option value="' + b.name + '">' + b.name + '</option>';
                });
                branchSelect.innerHTML = html;
            }
            renderBranches();
        }

        function renderBranches() {
            let branches = getElockerData();
            const searchKw = document.getElementById('search-input').value.trim().toLowerCase();
            const selectedBranch = document.getElementById('branch-select').value;
            const selectedType = document.getElementById('type-select').value;
            const container = document.getElementById('branches-container');

            let list = branches;
            if (selectedBranch) {
                list = list.filter(function(b) { return b.name === selectedBranch; });
            }
            if (selectedType) {
                list = list.filter(function(b) { return b.rentType === selectedType; });
            }
            if (searchKw) {
                list = list.filter(function(b) {
                    let matchName = b.name && b.name.toLowerCase().includes(searchKw);
                    let matchCity = b.city && b.city.toLowerCase().includes(searchKw);
                    let matchCode = b.code && b.code.toLowerCase().includes(searchKw);
                    return matchName || matchCity || matchCode;
                });
            }

            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state">查無符合條件的快存櫃據點資訊</div>';
                return;
            }

            container.innerHTML = list.map(function(b) {
                let floorsHtml = b.floors.map(function(f) {
                    let descDisplay = (f.desc && f.desc.trim() !== '') ? f.desc : '';
                    return '<tr>' +
                        '<td style="font-weight:bold; width: 90px;">' + f.floor + '</td>' +
                        '<td>' + descDisplay + '</td>' +
                    '</tr>';
                }).join('');

                return '<div class="branch-card" onclick="openBranchModal(\'' + b.name + '\')">' +
                    '<div class="branch-header">' +
                        '<span class="branch-title">🏢 ' + b.name + '<span class="code-tag">代碼: ' + b.code + '</span></span>' +
                        '<span class="branch-badge">' + b.rentTypeText + '</span>' +
                    '</div>' +
                    '<div class="branch-body">' +
                        '<div class="info-row"><strong>📍 地址：</strong><span>' + b.address + '</span></div>' +
                        '<div class="info-row"><strong>🕒 時間：</strong><span>' + b.hours + '</span></div>' +
                        '<div style="margin-top: 4px;">' +
                            '<strong style="font-size: 0.85rem; color: #475569; display: block; margin-bottom: 6px;">📐 樓層與櫃位位置：</strong>' +
                            '<table class="floor-table">' +
                                '<thead><tr><th>樓層/櫃號</th><th>位置說明</th></tr></thead>' +
                                '<tbody>' + floorsHtml + '</tbody>' +
                            '</table>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function openBranchModal(branchName) {
            let branches = getElockerData();
            let b = branches.find(function(item) { return item.name === branchName; });
            if (!b) return;

            document.getElementById('modal-title').innerText = '🏢 ' + b.name + ' (代碼: ' + b.code + ')';
            
            let modalFloorsHtml = b.floors.map(function(f) {
                let descDisplay = (f.desc && f.desc.trim() !== '') ? f.desc : '無特別說明';
                return '<tr><td style="font-weight:bold; width: 100px;">' + f.floor + '</td><td>' + descDisplay + '</td></tr>';
            }).join('');

            let modalBody = document.getElementById('modal-body-content');
            modalBody.innerHTML = 
                '<div class="info-row" style="font-size: 1rem;"><strong>📍 完整地址：</strong><span>' + b.address + '</span></div>' +
                '<div class="info-row" style="font-size: 1rem;"><strong>🕒 進出時間：</strong><span>' + b.hours + '</span></div>' +
                '<div class="info-row" style="font-size: 1rem;"><strong>📱 承租方式：</strong><span style="color: #059669; font-weight: bold;">' + b.rentTypeText + '</span></div>' +
                '<div class="info-row" style="font-size: 1rem;"><strong>📐 尺寸與月繳：</strong><span>' + b.sizesAvailable + ' ｜ ' + b.monthlyAvailable + '</span></div>' +
                '<div style="margin-top: 12px;">' +
                    '<strong style="font-size: 0.95rem; color: #1e293b; display: block; margin-bottom: 8px;">📋 各樓層櫃位詳細配置：</strong>' +
                    '<table class="floor-table">' +
                        '<thead><tr><th>樓層/櫃號</th><th>位置說明</th></tr></thead>' +
                        '<tbody>' + modalFloorsHtml + '</tbody>' +
                    '</table>' +
                '</div>';

            document.getElementById('branch-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('branch-modal').style.display = 'none';
        }
    </script>
