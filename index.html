<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收多易迷你倉庫 - Storeasy Storage 營運管理工具</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }
        aside { width: 250px; background: #0f172a; color: white; display: flex; flex-direction: column; }
        aside h2 { padding: 20px; font-size: 1.1rem; color: #fbbf24; border-bottom: 1px solid #1e293b; }
        aside nav { padding: 10px; display: flex; flex-direction: column; gap: 5px; }
        aside nav button { width: 100%; text-align: left; padding: 12px; background: transparent; border: none; color: #cbd5e1; font-weight: bold; cursor: pointer; border-radius: 6px; }
        aside nav button:hover, aside nav button.active { background: #f59e0b; color: #0f172a; }
        
        main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        header { background: white; padding: 20px 30px; border-bottom: 1px solid #cbd5e1; font-size: 1.2rem; font-weight: bold; color: #334155; }
        .container { padding: 30px; max-width: 1000px; width: 100%; margin: 0 auto; }
        .panel { background: white; padding: 20px; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        input, select { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 4px; }
        button.action-btn { background: #f59e0b; color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button.action-btn:hover { background: #d97706; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; font-size: 0.85rem; }
        th { background: #f8fafc; }
    </style>
</head>
<body>

    <aside>
        <h2>收多易迷你倉庫</h2>
        <nav>
            <button type="button" id="nav-storage" class="active" onclick="switchTab('storage')">📦 倉位資料</button>
            <button type="button" id="nav-quote" onclick="switchTab('quote')">📄 生成報價單</button>
            <button type="button" id="nav-invoice" onclick="switchTab('invoice')">💰 生成請款單</button>
        </nav>
    </aside>

    <main>
        <header id="main-header">📦 倉位資料</header>
        
        <div class="container">
            <!-- 倉位資料面板 -->
            <div id="panel-storage" class="panel">
                <h3>一鍵上傳各店空倉表 Excel</h3>
                <label>分店名稱</label>
                <input type="text" id="branch-name" value="土城店">
                <label>選擇 Excel 檔案</label>
                <input type="file" id="excel-file" accept=".xlsx, .xls, .csv">
                <button type="button" class="action-btn" onclick="uploadExcel()">一鍵智慧匯入資料</button>
                
                <h3 style="margin-top: 30px;">已載入的倉位清單</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>據點</th>
                                <th>編號</th>
                                <th>尺寸 (寬*深*高 m)</th>
                                <th>材積 (材)</th>
                                <th>月繳/原價</th>
                                <th>年繳(85折)</th>
                            </tr>
                        </thead>
                        <tbody id="storage-tbody">
                            <tr><td colspan="6" style="text-align: center; color: #64748b;">尚未匯入資料</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 報價單面板 -->
            <div id="panel-quote" class="panel hidden">
                <h3>生成報價單</h3>
                <p>這裡是用來設定與生成報價單的頁面。點擊左側「倉位資料」可以隨時切換回來。</p>
            </div>

            <!-- 請款單面板 -->
            <div id="panel-invoice" class="panel hidden">
                <h3>生成請款單</h3>
                <p>這裡是用來設定與生成請款單的頁面。</p>
            </div>
        </div>
    </main>

    <script>
        // 全域資料儲存
        let storageData = [];
        try {
            let saved = localStorage.getItem('storeasy_storage_data');
            if (saved) storageData = JSON.parse(saved) || [];
        } catch(e) {
            storageData = [];
        }

        // 絕對安全的頁籤切換
        function switchTab(tabName) {
            // 隱藏所有面板
            document.getElementById('panel-storage').classList.add('hidden');
            document.getElementById('panel-quote').classList.add('hidden');
            document.getElementById('panel-invoice').classList.add('hidden');

            // 移除所有按鈕 active 樣式
            document.getElementById('nav-storage').classList.remove('active');
            document.getElementById('nav-quote').classList.remove('active');
            document.getElementById('nav-invoice').classList.remove('active');

            // 顯示目標面板與按鈕樣式
            document.getElementById('panel-' + tabName).classList.remove('hidden');
            document.getElementById('nav-' + tabName).classList.add('active');

            // 更新標題
            const titles = {
                'storage': '📦 倉位資料',
                'quote': '📄 生成報價單',
                'invoice': '💰 生成請款單'
            };
            document.getElementById('main-header').innerText = titles[tabName];
        }

        // 上傳 Excel
        function uploadExcel() {
            const fileInput = document.getElementById('excel-file');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('請先選擇一個 Excel 檔案！');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonSheet = XLSX.utils.sheet_to_json(firstSheet, {header: 1});

                    if (jsonSheet.length < 2) {
                        alert('Excel 內容不足！');
                        return;
                    }

                    const branch = document.getElementById('branch-name').value.trim() || '土城店';
                    let newItems = [];

                    for (let i = 0; i < jsonSheet.length; i++) {
                        let row = jsonSheet[i];
                        if (!row || row.length === 0) continue;

                        let code = '';
                        let size = '-';
                        let unit = '-';
                        let price1 = NaN;

                        for (let c = 0; c < row.length; c++) {
                            let val = row[c];
                            if (val == null) continue;
                            let sVal = String(val).trim();

                            if (!code && (/^[A-Za-z]+\d+/.test(sVal) || (/^[A-Za-z]+$/.test(sVal) && row[c+1] !== undefined && !isNaN(row[c+1])))) {
                                code = sVal;
                                if (!isNaN(row[c+1])) code += row[c+1];
                            } else if (size === '-' && /(\d+(\.\d+)?)\s*[*xX]\s*(\d+(\.\d+)?)/.test(sVal)) {
                                size = sVal;
                            } else if (isNaN(price1) && !isNaN(Number(sVal)) && Number(sVal) > 300 && Number(sVal) < 100000) {
                                price1 = Number(sVal);
                            }
                        }

                        if (code && !isNaN(price1)) {
                            let p12_85 = Math.round((price1 * 0.85) / 10) * 10;
                            newItems.push({
                                branch: branch,
                                code: code,
                                size: size !== '-' ? size + ' m' : '標準尺寸',
                                unit: unit !== '-' ? unit : '50',
                                price1: price1,
                                price12_85: p12_85
                            });
                        }
                    }

                    if (newItems.length === 0) {
                        alert('未能自動辨識有效資料，請檢查格式。');
                        return;
                    }

                    storageData = storageData.concat(newItems);
                    localStorage.setItem('storeasy_storage_data', JSON.stringify(storageData));
                    renderTable();
                    alert('成功匯入 ' + newItems.length + ' 筆資料！');
                } catch(err) {
                    alert('解析檔案失敗：' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 渲染表格
        function renderTable() {
            const tbody = document.getElementById('storage-tbody');
            if (storageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #64748b;">尚未匯入資料</td></tr>`;
                return;
            }

            tbody.innerHTML = storageData.map(item => `
                <tr>
                    <td><b>${item.branch}</b></td>
                    <td>${item.code}</td>
                    <td>${item.size}</td>
                    <td>${item.unit}</td>
                    <td>NT$ ${item.price1.toLocaleString()}</td>
                    <td style="color: #059669; font-weight: bold;">NT$ ${item.price12_85.toLocaleString()}</td>
                </tr>
            `).join('');
        }

        // 初始化渲染
        renderTable();
    </script>
</body>
</html>
